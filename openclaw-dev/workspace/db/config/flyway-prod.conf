# flyway-prod.conf - Production environment
flyway.url=jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT:-5432}/${PROD_DB_NAME:-dev_db}
flyway.user=${PROD_DB_USER}
flyway.password=${PROD_DB_PASSWORD}
flyway.locations=filesystem:db/migrations
flyway.schemas=shared,dev_schema
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=false
flyway.dryRunOutput=/tmp/migration-dryrun.sql
