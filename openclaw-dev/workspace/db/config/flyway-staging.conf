# flyway-staging.conf - Staging environment
flyway.url=jdbc:postgresql://${STAGING_DB_HOST}:${STAGING_DB_PORT:-5432}/${STAGING_DB_NAME:-dev_db}
flyway.user=${STAGING_DB_USER}
flyway.password=${STAGING_DB_PASSWORD}
flyway.locations=filesystem:db/migrations
flyway.schemas=shared,dev_schema
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=false
