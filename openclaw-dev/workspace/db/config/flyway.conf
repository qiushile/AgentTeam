# flyway.conf - Default configuration
# All values can be overridden by environment variables

# Database connection
flyway.url=jdbc:postgresql://${DB_HOST:-172.23.0.14}:${DB_PORT:-5432}/${DB_NAME:-dev_db}
flyway.user=${DB_USER:-dev_user}
flyway.password=${DB_PASSWORD:-}

# Migration locations
flyway.locations=filesystem:db/migrations,filesystem:db/seeds

# Schemas to manage
flyway.schemas=shared,dev_schema

# History table
flyway.table=flyway_schema_history
flyway.createSchemas=true

# Validation
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=baseline

# Naming conventions
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Output
flyway.outputQueryResults=true
flyway.placeholderReplacement=true
