name: Database Migrations

on:
  push:
    paths:
      - 'db/migrations/**/*.sql'
    branches: [main, develop]
  pull_request:
    paths:
      - 'db/migrations/**/*.sql'

jobs:
  validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          postgres-version: '16'
          username: dev_user
          password: test_pass
          database: test_db
          port: 5432

      - name: Run Flyway Validate
        uses: docker://flyway/flyway:10
        with:
          args: >-
            -url=jdbc:postgresql://localhost:5432/test_db
            -user=dev_user
            -password=test_pass
            -locations=filesystem:db/migrations
            validate

  test-migrate:
    name: Test Migration
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          postgres-version: '16'
          username: dev_user
          password: test_pass
          database: test_db
          port: 5432

      - name: Run Flyway Migrate
        uses: docker://flyway/flyway:10
        with:
          args: >-
            -url=jdbc:postgresql://localhost:5432/test_db
            -user=dev_user
            -password=test_pass
            -locations=filesystem:db/migrations
            -schemas=shared,dev_schema
            -baselineOnMigrate=true
            migrate

      - name: Verify Schema
        run: |
          psql -h localhost -U dev_user -d test_db -c "\dt shared.*"
          psql -h localhost -U dev_user -d test_db -c "\dt dev_schema.*"
          psql -h localhost -U dev_user -d test_db -c "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank;"
        env:
          PGPASSWORD: test_pass
